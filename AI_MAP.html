<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--page);display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;padding:.75rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}

  .tools{display:flex;gap:.35rem;flex-wrap:wrap}
  button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:.4rem .7rem;cursor:pointer;min-width:2.3rem}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #stage{position:relative;flex:1 1 auto;min-height:420px;overflow:hidden;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
  .node{cursor:pointer}
  .node:focus{outline:none}
  .node:focus-visible .shape{stroke:#111 !important;stroke-width:3px !important}
  .dim{opacity:.12;transition:opacity .2s}
  .node,.edge{transition:opacity .2s}
  #info{position:absolute;right:12px;top:12px;max-width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.12);padding:.8rem 1rem;font-size:.9rem;display:none;cursor:auto}
  #info.show{display:block}
  #info h2{font-size:1rem;margin:0 1.8rem .5rem 0}
  #info ul{margin:0;padding-left:1.1rem}
  #info li{margin:.25rem 0;line-height:1.35}
  #info .close{position:absolute;right:.5rem;top:.45rem;min-width:0;padding:.15rem .5rem;border:none;font-size:1.1rem;color:var(--muted)}
  .lp{color:#0b6b3a;font-style:italic}
  .badge{cursor:pointer}
  .badge circle{fill:#037f8c;stroke:#fff;stroke-width:1.5}
  .badge:hover circle,.badge:focus-visible circle{fill:#025a63}
  .badge:focus{outline:none}
  .badge text{fill:#fff;font:700 11px Arial,sans-serif;pointer-events:none}
  #info .links{margin:.6rem 0 0;padding-top:.5rem;border-top:1px solid var(--line)}
  #info a{color:var(--accent)}
  #props{background:var(--panel);border-top:1px solid var(--line);padding:.5rem 1rem 1rem;max-height:45vh;overflow:auto}
  #props summary{cursor:pointer;font-weight:600;padding:.35rem 0}
  #props h3{font-size:.92rem;margin:.9rem 0 .25rem}
  #props ul{margin:0;padding-left:1.2rem;font-size:.88rem}
  #props li{margin:.15rem 0}
  @media (max-width:640px){header p{display:none}}
</style>

const NS = 'http://www.w3.org/2000/svg';
const FONTS = {
  'Cambria': 'Cambria, "Cambria Math", Georgia, "Times New Roman", serif',
  'Calibri': 'Calibri, Carlito, "Segoe UI", Arial, sans-serif',
  'Arial': 'Arial, Helvetica, sans-serif'
};
const svg = document.getElementById('map');
const gE = document.getElementById('edges');
const gN = document.getElementById('nodes');
document.getElementById('bg').setAttribute('fill', DATA.bg === 'none' ? '#f3f3f3' : DATA.bg);
const byId = {};
DATA.nodes.forEach(n => byId[n.id] = n);

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const oneLine = n => n.lines.join(' ');

function buildNode(n){
  const g = el('g', {class: 'node ' + (n.kind === 'c' ? 'concept' : 'phrase'), transform: `translate(${n.x},${n.y})`}, gN);
  n.g = g;
  const shape = n.kind === 'c' ? el('g', {}, g) : null;
  const text = el('text', {'text-anchor': 'middle', 'font-family': FONTS[n.font] || (n.font + ', sans-serif'),
    'font-size': n.size, 'fill': n.fg === 'none' ? '#000' : n.fg,
    'font-weight': n.bold ? 700 : 400, 'font-style': n.italic ? 'italic' : 'normal'}, g);
  const lh = n.size * 1.22;
  n.lines.forEach((t, i) => { const ts = el('tspan', {x: 0, dy: i ? lh : 0}, text); ts.textContent = t; });
  const bb = text.getBBox();
  const tw = bb.width, th = n.lines.length * lh;
  const ascent = n.size * 0.9;
  const padX = n.kind === 'c' ? 9 : 3, padY = n.kind === 'c' ? 6 : 2, gap = 5;
  let cw = tw, ch = th, iconX = 0, iconY = 0, textX = 0, textTop = 0;
  if (n.icon){
    if (n.iconPos === 'top'){
      cw = Math.max(tw, n.iw); ch = n.ih + gap + th;
      iconX = -n.iw / 2; iconY = -ch / 2; textTop = -ch / 2 + n.ih + gap;
    } else {
      cw = n.iw + gap + tw; ch = Math.max(n.ih, th);
      iconX = -cw / 2; iconY = -n.ih / 2; textX = -cw / 2 + n.iw + gap + tw / 2; textTop = -th / 2;
    }
    el('image', {href: n.icon, x: iconX, y: iconY, width: n.iw, height: n.ih}, g);
  } else {
    textTop = -th / 2;
  }
  text.setAttribute('x', textX);
  text.querySelectorAll('tspan').forEach(ts => ts.setAttribute('x', textX));
  text.setAttribute('y', textTop + ascent + (lh - n.size) / 2);
  let w = Math.max(cw + 2 * padX, n.minW), h = Math.max(ch + 2 * padY, n.minH);
  n.w = w; n.h = h; n.ellipse = false;
  if (shape){
    const fill = n.bg === 'none' ? 'transparent' : n.bg;
    const stroke = n.ln === 'none' ? 'none' : n.ln;
    {
      const rx = n.shape === 3 ? Math.min(h / 2, 26) : n.shape === 2 ? 10 : 4;
      el('rect', {class: 'shape', x: -w / 2, y: -h / 2, width: w, height: h, rx, fill, stroke, 'stroke-width': n.lw,
        filter: n.shadow ? 'url(#shadow)' : ''}, shape);
    }
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.setAttribute('aria-label', oneLine(n));
    if (n.links && n.links.length){
      const bx = n.w / 2 - 3, by = -n.h / 2 + 3;
      const b = el('g', {class: 'badge', transform: `translate(${bx},${by})`, tabindex: '0', role: 'link',
        'aria-label': 'Άνοιγμα συνδέσμου: ' + n.links[0].name}, g);
      el('title', {}, b).textContent = 'Άνοιγμα: ' + n.links.map(l => l.name).join(', ');
      el('circle', {r: 9}, b);
      const t = el('text', {'text-anchor': 'middle', y: 4}, b); t.textContent = '↗';
      b.__node = n;
    }
  } else if (n.bg !== 'none'){
    el('rect', {x: -w / 2, y: -h / 2, width: w, height: h, fill: n.bg}, g).parentNode.insertBefore(g.lastChild, g.firstChild);
  }
}

function clip(n, dx, dy){
  if (!dx && !dy) return [n.x, n.y];
  if (n.ellipse){
    const a = n.w / 2, b = n.h / 2, t = 1 / Math.sqrt((dx * dx) / (a * a) + (dy * dy) / (b * b));
    return [n.x + dx * t, n.y + dy * t];
  }
  const hw = n.w / 2 + 2, hh = n.h / 2 + 2;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [n.x + dx * t, n.y + dy * t];
}

function buildEdges(){
  DATA.edges.forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const p = clip(a, dx, dy), q = clip(b, -dx, -dy);
    const attrs = {class: 'edge', x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: e.color === 'none' ? '#000' : e.color,
      'stroke-width': e.w, 'stroke-linecap': 'round'};
    if (e.dash) attrs['stroke-dasharray'] = '7 5';
    if (b.kind === 'c') attrs['marker-end'] = 'url(#arrow)';
    e.line = el('line', attrs, gE);
  });
}

/* ---------- propositions ---------- */
const props = [];
function buildProps(){
  DATA.nodes.filter(n => n.kind === 'l').forEach(l => {
    const src = DATA.edges.filter(e => e.to === l.id && byId[e.from] && byId[e.from].kind === 'c');
    const tgt = DATA.edges.filter(e => e.from === l.id && byId[e.to] && byId[e.to].kind === 'c');
    src.forEach(s => tgt.forEach(t => props.push({a: byId[s.from], l, b: byId[t.to], e1: s, e2: t})));
  });
  document.getElementById('pcount').textContent = props.length;
  const groups = new Map();
  props.slice().sort((p, q) => (p.a.y - q.a.y) || (p.a.x - q.a.x)).forEach(p => {
    if (!groups.has(p.a)) groups.set(p.a, []);
    groups.get(p.a).push(p);
  });
  const box = document.getElementById('plist');
  groups.forEach((list, a) => {
    const h = document.createElement('h3'); h.textContent = oneLine(a); box.appendChild(h);
    const ul = document.createElement('ul');
    list.forEach(p => { const li = document.createElement('li');
      li.innerHTML = `<span class="lp"></span> → <b></b>`;
      li.querySelector('.lp').textContent = oneLine(p.l); li.querySelector('b').textContent = oneLine(p.b);
      ul.appendChild(li); });
    box.appendChild(ul);
  });
}

/* ---------- selection ---------- */
const info = document.getElementById('info');
function select(n){
  const mine = props.filter(p => p.a === n || p.b === n);
  const keepN = new Set([n]), keepE = new Set();
  mine.forEach(p => { keepN.add(p.a); keepN.add(p.l); keepN.add(p.b); keepE.add(p.e1); keepE.add(p.e2); });
  DATA.nodes.forEach(m => m.g.classList.toggle('dim', !keepN.has(m)));
  DATA.edges.forEach(e => e.line && e.line.classList.toggle('dim', !keepE.has(e)));
  document.getElementById('info-title').textContent = oneLine(n);
  const ul = document.getElementById('info-list'); ul.innerHTML = '';
  if (!mine.length){ const li = document.createElement('li'); li.textContent = 'Δεν συνδέεται με άλλες έννοιες.'; ul.appendChild(li); }
  mine.forEach(p => { const li = document.createElement('li');
    li.innerHTML = '<b></b> <span class="lp"></span> <b></b>';
    const [b1, s, b2] = li.children; b1.textContent = oneLine(p.a); s.textContent = oneLine(p.l); b2.textContent = oneLine(p.b);
    ul.appendChild(li); });
  const old = info.querySelector('.links'); if (old) old.remove();
  if (n.links && n.links.length){
    const d = document.createElement('div'); d.className = 'links';
    d.innerHTML = '<b>Σύνδεσμοι:</b> ';
    n.links.forEach((l, i) => { const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = l.name; if (i) d.append(' · '); d.appendChild(a); });
    info.appendChild(d);
  }
  info.classList.add('show');
}
function openLink(n){
  if (!n.links || !n.links.length) return;
  if (n.links.length > 1) { select(n); return; }
  window.open(n.links[0].url, '_blank', 'noopener');
}
function clearSel(){
  DATA.nodes.forEach(m => m.g.classList.remove('dim'));
  DATA.edges.forEach(e => e.line && e.line.classList.remove('dim'));
  info.classList.remove('show');
}
info.querySelector('.close').addEventListener('click', clearSel);

/* ---------- pan & zoom ---------- */
let vb = {x: 0, y: 0, w: 1600, h: 1200}, bounds;
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fit(){
  const r = svg.getBoundingClientRect(), m = 24;
  const bw = bounds.w + 2 * m, bh = bounds.h + 2 * m;
  const s = Math.max(bw / r.width, bh / r.height);
  vb.w = r.width * s; vb.h = r.height * s;
  vb.x = bounds.x - m - (vb.w - bw) / 2; vb.y = bounds.y - m - (vb.h - bh) / 2;
  setVB();
}
function zoomAt(f, cx, cy){
  const r = svg.getBoundingClientRect();
  const px = vb.x + (cx - r.left) / r.width * vb.w, py = vb.y + (cy - r.top) / r.height * vb.h;
  const nw = Math.min(Math.max(vb.w * f, 150), bounds.w * 6);
  const k = nw / vb.w;
  vb.x = px - (px - vb.x) * k; vb.y = py - (py - vb.y) * k; vb.w *= k; vb.h *= k;
  setVB();
}
const stage = document.getElementById('stage');
stage.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(Math.exp(ev.deltaY * 0.0015), ev.clientX, ev.clientY); }, {passive: false});
const ptrs = new Map(); let moved = 0, pinch = null, downTarget = null, downBadge = null;
stage.addEventListener('pointerdown', ev => {
  if (info.contains(ev.target)) return;
  stage.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  moved = 0; downTarget = ev.target.closest('.node'); downBadge = ev.target.closest('.badge');
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
stage.addEventListener('pointermove', ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const prev = ptrs.get(ev.pointerId); const r = svg.getBoundingClientRect();
  if (ptrs.size === 1){
    const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) stage.classList.add('dragging');
    vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; setVB();
  }
  ptrs.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(pinch / d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch = d; moved = 99;
  }
});
function up(ev){
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId); if (ptrs.size < 2) pinch = null;
  stage.classList.remove('dragging');
  if (ptrs.size === 0 && moved <= 4 && downBadge){ openLink(downBadge.__node); return; }
  if (ptrs.size === 0 && moved <= 4){
    const n = downTarget && DATA.nodes.find(m => m.g === downTarget);
    if (n && n.kind === 'c') select(n); else if (!downTarget) clearSel();
  }
}
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
document.getElementById('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById('fit').onclick = fit;
window.addEventListener('resize', fit);
gN.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  if (ev.target.classList.contains('badge')){ ev.preventDefault(); ev.stopPropagation(); openLink(ev.target.__node); return; }
  const n = DATA.nodes.find(m => m.g === ev.target);
  if (n){ ev.preventDefault(); select(n); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') clearSel(); });

/* ---------- go ---------- */
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  const concepts = DATA.nodes.filter(n => n.kind === 'c'), phrases = DATA.nodes.filter(n => n.kind === 'l');
  phrases.forEach(buildNode); concepts.forEach(buildNode);
  buildEdges(); buildProps();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  DATA.nodes.forEach(n => { x0 = Math.min(x0, n.x - n.w / 2); y0 = Math.min(y0, n.y - n.h / 2);
    x1 = Math.max(x1, n.x + n.w / 2); y1 = Math.max(y1, n.y + n.h / 2); });
  bounds = {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  fit();
})();
</script>
</body>
</html>
